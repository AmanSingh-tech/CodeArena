version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algotask
      POSTGRES_USER: algotask_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algotask_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotask_user -d algotask"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend Server
  server:
    build: ./server
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://algotask_user:${POSTGRES_PASSWORD:-algotask_password}@postgres:5432/algotask
      JWT_PASSKEY: ${JWT_PASSKEY:-change-this-in-production}
      SALT_ROUNDS: ${SALT_ROUNDS:-10}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      COMPILER_SERVICE_URL: http://compiler:3002
    ports:
      - "8000:3001"
    depends_on:
      postgres:
        condition: service_healthy
      compiler:
        condition: service_started
    command: ["sh", "-c", "npx prisma migrate deploy && node index.js"]
    restart: unless-stopped

  # Code Compiler Service
  compiler:
    build: ./Compiler
    environment:
      PORT: 3002
      # Submissions judged in parallel; defaults to the number of CPU cores.
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-}
    # The judge runs untrusted code, so it is only reachable from this host
    # and from the server container, never from the internet.
    ports:
      - "127.0.0.1:3002:3002"
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Frontend (Production)
  frontend:
    build: ./client
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - server
      - compiler
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
